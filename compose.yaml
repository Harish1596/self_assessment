name: recall
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recall
      POSTGRES_DB: recall
      POSTGRES_PASSWORD: ${RECALL_DB_PASSWORD:-recall_local}
    ports:
      - '127.0.0.1:${RECALL_DB_PORT:-54329}:5432'
    volumes:
      - recall_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U recall -d recall']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: recall
      PGUSER: recall
      PGPASSWORD: ${RECALL_DB_PASSWORD:-recall_local}
    ports:
      - '127.0.0.1:${RECALL_WEB_PORT:-5173}:3001'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  recall_postgres:
